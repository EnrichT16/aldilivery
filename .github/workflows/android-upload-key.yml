# Makes the Android upload key once, without Java on anybody's computer (15 November 2026).
#
# Google Play only accepts an app signed with a key that proves it came from us. This makes that
# key on GitHub's own computer, protected by the password already saved as the secret
# ANDROID_KEYSTORE_PASSWORD, and hands it over as a download on this run's page. The password
# never appears in the log, and the key never passes through a chat.
#
# How to use it (docs/APP_STORES.md, part 5):
#   1. Add the secret ANDROID_KEYSTORE_PASSWORD first: a long password of your own choosing.
#   2. Run this workflow. Type the word MAKE in the box.
#   3. On the finished run's page, download "android-upload-key". It holds two files:
#      upload.keystore (keep it safe, in two places) and upload.keystore.base64.txt.
#   4. Paste the whole of the .txt file as the secret ANDROID_KEYSTORE_BASE64. Add
#      ANDROID_KEY_ALIAS (the word upload) and ANDROID_KEY_PASSWORD (the same password).
#   5. Delete the download from the run's page. It is removed by itself after one day anyway.
#
# Run it once only. A second key is a different key: Google would refuse updates signed with it.

name: Make the Android upload key

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MAKE to make a new upload key (only ever needed once)
        required: true
        default: ''

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the word and the password
        env:
          CONFIRM: ${{ inputs.confirm }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXISTING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$CONFIRM" != "MAKE" ]; then
            echo "::error::Type MAKE in the box to make the key."; exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Add the secret ANDROID_KEYSTORE_PASSWORD first, then run this again."; exit 1
          fi
          if [ "${#STORE_PASSWORD}" -lt 12 ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is shorter than 12 characters. Choose a longer one."; exit 1
          fi
          if [ -n "$EXISTING" ]; then
            echo "::error::An upload key is already saved as ANDROID_KEYSTORE_BASE64. A second key would not match it, so nothing was made."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make the key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # The company's name comes from configuration, never written here.
          company=$(jq -r '.. | objects | .legalEntityName? // empty' config/store.json | head -n 1)
          if [ -z "$company" ]; then echo "::error::No legalEntityName in config/store.json."; exit 1; fi
          mkdir key
          keytool -genkeypair -noprompt \
            -keystore key/upload.keystore -storetype PKCS12 \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env STORE_PASSWORD -keypass:env STORE_PASSWORD \
            -dname "CN=$company, O=$company, C=GB"
          base64 -w0 key/upload.keystore > key/upload.keystore.base64.txt
          echo "Made. The key's fingerprint, which is safe to show:"
          keytool -list -keystore key/upload.keystore -storepass:env STORE_PASSWORD | grep -i 'fingerprint' || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-key
          path: key/
          retention-days: 1
          if-no-files-found: error
