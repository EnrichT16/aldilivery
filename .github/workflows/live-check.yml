name: Live check

# Makes, from outside, the same requests the sign-in page makes, and prints what the live
# server answers: status, content type, timing and the start of the body. Run by hand when a
# phone says "We cannot reach" the service and the runtime logs do not say why
# (16 October 2026). With a phone number it also asks for a real sign-in code, which uses one
# of that number's three codes per quarter hour.

on:
  workflow_dispatch:
    inputs:
      phone:
        description: 'UK mobile to text a sign-in code to (leave empty to skip)'
        required: false
        default: ''
      expect_commit:
        description: 'Fail unless /api/health reports this commit (start of the hash), to watch a deployment'
        required: false
        default: ''
      get_path:
        description: 'An extra path to GET on www and print, such as /api/catalogue/search?q=banana'
        required: false
        default: ''
      ask_ozi:
        description: 'Words to say to Ozi as a visitor on www, to see whether the model answers (leave empty to skip)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Addresses
        run: |
          for host in www.ozidelivery.co.uk ozidelivery.co.uk lobster-app-3ilv6.ondigitalocean.app; do
            echo "== dig $host"; dig +short "$host" CNAME; dig +short "$host" A
          done

      - name: The bare address, as somebody typing ozidelivery.co.uk would reach it
        run: |
          for url in http://ozidelivery.co.uk/ https://ozidelivery.co.uk/ http://www.ozidelivery.co.uk/ https://www.ozidelivery.co.uk/staff; do
            echo "== GET $url (no redirects followed)"
            curl -sS -m 40 -o body.txt -D headers.txt -w 'status=%{http_code} time=%{time_total}s\n' "$url" || echo "curl failed: $?"
            grep -i '^location\|^content-type\|^server\|^x-frame\|^content-security' headers.txt || true
            if grep -qi '<frame\|<iframe' body.txt; then echo "BODY CONTAINS A FRAME (masked forwarding)"; fi
            head -c 400 body.txt; echo
          done

      - name: GET health and config, both hosts
        run: |
          for host in www.ozidelivery.co.uk lobster-app-3ilv6.ondigitalocean.app; do
            for path in /api/health /api/config; do
              echo "== GET https://$host$path"
              curl -sS -m 40 -o body.txt -D headers.txt -w 'status=%{http_code} time=%{time_total}s\n' "https://$host$path" || echo "curl failed: $?"
              grep -i '^content-type' headers.txt || true
              head -c 300 body.txt; echo
            done
          done

      - name: Extra GET
        env:
          GET_PATH: ${{ inputs.get_path }}
        run: |
          if [ -z "$GET_PATH" ]; then echo "No extra path: skipping."; exit 0; fi
          echo "== GET https://www.ozidelivery.co.uk$GET_PATH"
          curl -sS -m 40 -o body.txt -D headers.txt -w 'status=%{http_code} time=%{time_total}s\n' "https://www.ozidelivery.co.uk$GET_PATH" || echo "curl failed: $?"
          grep -i '^content-type' headers.txt || true
          head -c 2500 body.txt; echo

      - name: Ask Ozi, as a visitor's phone would (the answer carries "understood" only when the model made it)
        env:
          ASK: ${{ inputs.ask_ozi }}
        run: |
          if [ -z "$ASK" ]; then echo "Nothing to ask: skipping."; exit 0; fi
          body=$(jq -n --arg text "$ASK" '{text:$text, mode:"within", turn:0, conversation:"live-check"}')
          for n in 1 2; do
            echo "== POST https://www.ozidelivery.co.uk/api/ozi/reply (go $n)"
            curl -sS -m 40 -o body.txt -D headers.txt \
              -H 'content-type: application/json' -H 'Origin: https://www.ozidelivery.co.uk' \
              --data "$body" -w 'status=%{http_code} time=%{time_total}s\n' \
              https://www.ozidelivery.co.uk/api/ozi/reply || echo "curl failed: $?"
            head -c 1500 body.txt; echo
          done
          echo "== POST https://www.ozidelivery.co.uk/api/ozi/talk (the conversation, ruling 99; events as they come)"
          talk=$(jq -n --arg text "$ASK" '{text:$text, turn:0, conversation:"live-check-talk"}')
          curl -sS -N -m 60 -H 'content-type: application/json' -H 'accept: text/event-stream' \
            -H 'Origin: https://www.ozidelivery.co.uk' --data "$talk" \
            -w '\nstatus=%{http_code} first_byte=%{time_starttransfer}s total=%{time_total}s\n' \
            https://www.ozidelivery.co.uk/api/ozi/talk | head -c 4000 || echo "curl failed: $?"
          echo
          echo "== health afterwards"
          curl -sS -m 40 https://www.ozidelivery.co.uk/api/health | head -c 900; echo

      - name: POST the Stripe webhook address, as Stripe would (unsigned, so a quick 400 is right)
        run: |
          for host in www.ozidelivery.co.uk lobster-app-3ilv6.ondigitalocean.app; do
            echo "== POST https://$host/api/webhooks/stripe"
            curl -sS -m 40 -o body.txt -D headers.txt \
              -H 'content-type: application/json; charset=utf-8' \
              -H 'User-Agent: Stripe/1.0 (+https://stripe.com/docs/webhooks)' \
              -H 'Stripe-Signature: t=1,v1=0' \
              --data '{"id":"evt_probe","type":"payment_intent.succeeded","data":{"object":{}}}' \
              -w 'status=%{http_code} time=%{time_total}s redirect=%{redirect_url}\n' \
              "https://$host/api/webhooks/stripe" || echo "curl failed: $?"
            cat headers.txt
            head -c 600 body.txt; echo
          done

      - name: Is the expected commit live yet?
        env:
          EXPECT: ${{ inputs.expect_commit }}
        run: |
          if [ -z "$EXPECT" ]; then echo "No commit expected: skipping."; exit 0; fi
          live=$(curl -sS -m 40 https://www.ozidelivery.co.uk/api/health | grep -o '"commit":"[0-9a-f]*' | cut -c11-)
          echo "live commit: $live"
          case "$live" in "$EXPECT"*) echo "deployed";; *) echo "not yet"; exit 1;; esac

      - name: Preflight, as a browser on www would send it
        run: |
          curl -sS -m 40 -o /dev/null -D - -X OPTIONS \
            -H 'Origin: https://www.ozidelivery.co.uk' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -w 'status=%{http_code}\n' \
            https://www.ozidelivery.co.uk/api/auth/request-code | grep -i 'status=\|access-control\|^HTTP'

      - name: POST request-code, both hosts
        env:
          PHONE: ${{ inputs.phone }}
        run: |
          if [ -z "$PHONE" ]; then echo "No phone given: skipping."; exit 0; fi
          for host in www.ozidelivery.co.uk lobster-app-3ilv6.ondigitalocean.app; do
            echo "== POST https://$host/api/auth/request-code"
            curl -sS -m 90 -o body.txt -D headers.txt \
              -H 'content-type: application/json' \
              -H "Origin: https://$host" \
              -H 'User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1' \
              --data "{\"phone\":\"$PHONE\",\"role\":\"shopper\",\"channel\":\"text\",\"purpose\":\"sign-in\"}" \
              -w 'status=%{http_code} time=%{time_total}s\n' \
              "https://$host/api/auth/request-code" || echo "curl failed: $?"
            cat headers.txt
            head -c 600 body.txt; echo
          done
