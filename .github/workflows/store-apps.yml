# Builds the phone apps for Google Play and the App Store (docs/APP_STORES.md).
#
# It never runs by itself. Somebody opens the Actions tab on GitHub, chooses "Phone apps for
# the stores", presses "Run workflow" and picks Android, iPhone or both. Each part checks that
# its secrets have been added first, and stops with a plain message if they have not.
#
# Android: an .aab file to upload to Google Play, and an .apk to put straight on a phone for
#   testing. Needs ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
#   ANDROID_KEY_PASSWORD. GOOGLE_SERVICES_JSON_BASE64 is optional (phone notifications).
# iPhone: an .ipa, built on GitHub's Mac, signed by Apple's cloud signing, and sent to
#   TestFlight if "Send to TestFlight" is ticked. Needs APPLE_TEAM_ID,
#   APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID and
#   APP_STORE_CONNECT_API_KEY_BASE64.
#
# No secret value is ever written in this file. They live in GitHub, under Settings, Secrets
# and variables, Actions.

name: Phone apps for the stores

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [both, android, ios]
        default: both
      version:
        description: Version people see in the store, such as 1.0.0 (blank uses packages/mobile/package.json)
        type: string
        required: false
      upload_to_testflight:
        description: Send the iPhone app to TestFlight when it is built
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: store-apps
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ inputs.version }}
    steps:
      - name: Check the Android secrets are there
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::These GitHub secrets are not added yet:$missing. docs/APP_STORES.md, part 5, says how."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app and the Android project
        run: pnpm --filter @aldilivery/mobile build --android --assets

      - name: Add the notifications file, if there is one
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > packages/mobile/build/android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret: the app builds, but phone notifications stay off."
          fi

      - name: Build and sign the .aab and .apk
        working-directory: packages/mobile/build/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: |
            packages/mobile/build/android/app/build/outputs/bundle/release/*.aab
            packages/mobile/build/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ inputs.version }}
    steps:
      - name: Check the Apple secrets are there
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing APP_STORE_CONNECT_API_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing APP_STORE_CONNECT_API_ISSUER_ID"
          [ -z "$KEY" ] && missing="$missing APP_STORE_CONNECT_API_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::These GitHub secrets are not added yet:$missing. docs/APP_STORES.md, part 5, says how."
            exit 1
          fi

      - name: Use the newest Xcode on the Mac
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app and the iPhone project
        run: pnpm --filter @aldilivery/mobile build --ios --assets

      - name: Build, sign and export the .ipa
        working-directory: packages/mobile/build/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          UPLOAD: ${{ inputs.upload_to_testflight }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$KEY" | base64 --decode > "$KEY_PATH"
          if [ "$UPLOAD" = "true" ]; then DESTINATION=upload; else DESTINATION=export; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            $AUTH archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH
          mkdir -p "$GITHUB_WORKSPACE/ios-output"
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/ios-output/" 2>/dev/null || true
          rm -f "$KEY_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios-output/
          if-no-files-found: ignore
          retention-days: 30
