# DigitalOcean App Platform specification for Aldilivery.
#
# Two components and one database, all in one app, behind one hostname:
#
#   web   a static site, served at /
#   api   a Fastify service, served at /api
#   db    a managed PostgreSQL development database
#
# Because both components sit behind the same hostname, the browser calls the API at /api
# on its own origin. Nothing is cross origin in normal use, and ALLOWED_ORIGIN names that
# one hostname so that nothing else may call the API from a browser at all.
#
# To apply this file:  doctl apps create --spec .do/app.yaml
# To update an app:    doctl apps update <app-id> --spec .do/app.yaml
# Or paste it into the App Platform dashboard under Settings, App Spec.
#
# The values marked FILL IN are the only ones Anthony has to type. DEPLOY.md says exactly
# where each one comes from and where it goes.

name: aldilivery
region: lon

# ---------------------------------------------------------------------------
# The API
# ---------------------------------------------------------------------------
services:
  - name: api
    github:
      repo: EnrichT16/aldilivery
      branch: main
      deploy_on_push: true

    # The repository root, not packages/api. This is a pnpm workspace: the API imports
    # @aldilivery/core, and the fee engine and the store configuration both live above the
    # api package. Building from anywhere else would leave the fee engine behind.
    source_dir: /
    environment_slug: node-js

    # --prod=false is not optional. NODE_ENV is production at run time, and pnpm reads
    # NODE_ENV: without this flag it would skip devDependencies and the TypeScript
    # compiler would not be there to build with.
    build_command: |
      corepack enable || npm install --global pnpm@9.15.9
      pnpm install --frozen-lockfile --prod=false
      pnpm run build:core
      pnpm --filter @aldilivery/api build

    # Applies any outstanding database migrations, then starts the server. In that order,
    # and never the other way round.
    run_command: pnpm --filter @aldilivery/api start

    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1

    health_check:
      http_path: /health
      # Migrations run before the server binds a port, so the first check waits.
      initial_delay_seconds: 45
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5

    # How the routing works, because this is the part that looks wrong when it is right.
    #
    # App Platform turns each component's `routes` into ingress rules and matches them by
    # how specific the path is, not by the order they appear in this file. `/api` is more
    # specific than `/`, so anything beginning `/api` comes here and everything else goes to
    # the static site. Verified live: `/api/health` returns the API's JSON, and `/api/nope`
    # returns the API's own JSON 404 rather than the web app's page, which is the proof that
    # this rule is matching rather than being fallen past.
    #
    # The prefix is stripped before the request reaches the server, so this component sees
    # `/health`. It also answers on `/api/health` itself — see the note in src/app.ts — so
    # the API keeps working whether the prefix is stripped or not.
    #
    # While this component is redeploying it serves nothing, and a request to /api then
    # falls through to the static site's catchall_document and comes back as HTML with a 200
    # on it. That is not a routing fault and it goes away on its own; the web client now says
    # it cannot reach Aldilivery rather than showing an empty shop.
    routes:
      - path: /api

    envs:
      # NODE_ENV must stay at run time only, for the pnpm reason given above.
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

      - key: PORT
        scope: RUN_TIME
        value: "8080"

      # Bound to the database below. App Platform fills this in; do not type a value here.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${aldilivery-db.DATABASE_URL}

      # FILL IN: the app's own https address, with no trailing slash, once App Platform has
      # given the app a hostname. This is the only browser origin allowed to call the API.
      - key: ALLOWED_ORIGIN
        scope: RUN_TIME
        value: ""

      # FILL IN, in the dashboard, as secrets. Each carries a marker the API recognises as
      # "not a real secret", so until they are replaced the server refuses to start in
      # production and the log names the one that is missing. That is deliberate: an
      # Aldilivery that cannot take a payment is far better than one that pretends it can.
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: replace_with_the_secret_key_from_stripe

      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: replace_with_the_webhook_signing_secret_from_stripe

      # Signs session tokens. Generate one with: openssl rand -base64 48
      - key: AUTH_TOKEN_SECRET
        scope: RUN_TIME
        type: SECRET
        value: replace_with_a_long_random_value_at_least_32_chars

# ---------------------------------------------------------------------------
# The web app
# ---------------------------------------------------------------------------
static_sites:
  - name: web
    github:
      repo: EnrichT16/aldilivery
      branch: main
      deploy_on_push: true

    source_dir: /
    environment_slug: node-js

    # This build is the accessibility gate. `pnpm --filter @aldilivery/web build` runs the
    # linter, the type check and the axe tests against every screen, and only then produces
    # a bundle. A screen with an accessibility violation does not deploy.
    build_command: |
      corepack enable || npm install --global pnpm@9.15.9
      pnpm install --frozen-lockfile --prod=false
      pnpm run build:core
      pnpm --filter @aldilivery/web build

    output_dir: packages/web/dist
    index_document: index.html
    # A single page app: every address that is not a file on disk is answered with the app
    # itself, so a refresh on /basket does not give a 404.
    catchall_document: index.html

    envs:
      # FILL IN: leave it as /api if the web app and the API share this hostname, which is
      # what the routes below arrange. Build time, because Vite bakes it into the bundle.
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: "/api"

    # Everything that is not /api. `catchall_document` above means any address that is not a
    # file on disk is answered with index.html, so a refresh on /basket works — and so an
    # address under /api would be answered here too if the API were not matching first.
    routes:
      - path: /

# ---------------------------------------------------------------------------
# The database
# ---------------------------------------------------------------------------
# Rule Eight: this database belongs to Aldilivery and to nothing else. It is a development
# database, which is the smallest managed PostgreSQL App Platform offers, and it is not
# backed up. Move it to a production cluster before there are real orders in it.
databases:
  - name: aldilivery-db
    engine: PG
    version: "16"
    production: false
