# DigitalOcean App Platform specification for the app at ozidelivery.co.uk. The product's
# name is in config/store.json, not here (Rule Nine).
#
# Two components and one database, all in one app, behind one hostname:
#
#   web   a static site, served at /
#   api   a Fastify service, served at /api
#   db    a managed PostgreSQL development database
#
# Because both components sit behind the same hostname, the browser calls the API at /api
# on its own origin. Nothing is cross origin in normal use, and ALLOWED_ORIGIN names that
# one hostname so that nothing else may call the API from a browser at all.
#
# To apply this file:  doctl apps create --spec .do/app.yaml
# To update an app:    doctl apps update <app-id> --spec .do/app.yaml
# Or paste it into the App Platform dashboard under Settings, App Spec.
#
# The values marked FILL IN are the only ones Anthony has to type. DEPLOY.md says exactly
# where each one comes from and where it goes.

# The app's name inside DigitalOcean, and the database's below, are left as they were when the
# product was renamed on 28 Sep 2026. Nobody outside the dashboard ever sees them, and changing
# the app name here would make DigitalOcean create a second app rather than rename this one.
name: aldilivery
region: lon

# The public address. The app keeps its own ondigitalocean.app address as well, and that
# keeps working. Add these in the dashboard under Settings, Domains; DEPLOY.md, "Moving to
# the new domain", has the steps, including the records to add at the registrar.
domains:
  - domain: ozidelivery.co.uk
    type: PRIMARY
  - domain: www.ozidelivery.co.uk
    type: ALIAS

# ---------------------------------------------------------------------------
# The API
# ---------------------------------------------------------------------------
services:
  - name: api
    github:
      repo: EnrichT16/aldilivery
      branch: main
      deploy_on_push: true

    # The repository root, not packages/api. This is a pnpm workspace: the API imports
    # @aldilivery/core, and the fee engine and the store configuration both live above the
    # api package. Building from anywhere else would leave the fee engine behind.
    source_dir: /
    environment_slug: node-js

    # --prod=false is not optional. NODE_ENV is production at run time, and pnpm reads
    # NODE_ENV: without this flag it would skip devDependencies and the TypeScript
    # compiler would not be there to build with.
    build_command: |
      corepack enable || npm install --global pnpm@9.15.9
      pnpm install --frozen-lockfile --prod=false
      pnpm run build:core
      pnpm --filter @aldilivery/api build

    # Applies any outstanding database migrations, then starts the server. In that order,
    # and never the other way round.
    run_command: pnpm --filter @aldilivery/api start

    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1

    health_check:
      http_path: /health
      # Migrations run before the server binds a port, so the first check waits.
      initial_delay_seconds: 45
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5

    # How the routing works, because this is the part that looks wrong when it is right.
    #
    # App Platform turns each component's `routes` into ingress rules and matches them by
    # how specific the path is, not by the order they appear in this file. `/api` is more
    # specific than `/`, so anything beginning `/api` comes here and everything else goes to
    # the static site. Verified live: `/api/health` returns the API's JSON, and `/api/nope`
    # returns the API's own JSON 404 rather than the web app's page, which is the proof that
    # this rule is matching rather than being fallen past.
    #
    # The prefix is stripped before the request reaches the server, so this component sees
    # `/health`. It also answers on `/api/health` itself — see the note in src/app.ts — so
    # the API keeps working whether the prefix is stripped or not.
    #
    # When this component has no healthy version running — a deployment that errored, or the
    # very first one — a request to /api falls through to the static site's catchall_document
    # and comes back as HTML with a 200 on it. That is not a routing fault, but it does not
    # clear on its own either: it lasts until a deployment succeeds. Measured 18 Sep 2026, a
    # *successful* redeploy leaves no such gap — the running version keeps serving and the new
    # one went active nine seconds before the old was retired. The web client now says it
    # cannot reach the service rather than showing an empty shop.
    routes:
      - path: /api

    envs:
      # NODE_ENV must stay at run time only, for the pnpm reason given above.
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

      - key: PORT
        scope: RUN_TIME
        value: "8080"

      # Bound to the database below. App Platform fills this in; do not type a value here.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${aldilivery-db.DATABASE_URL}

      # FILL IN: the app's own https address, with no trailing slash, once App Platform has
      # given the app a hostname. These are the only browser origins allowed to call the API.
      # A comma separated list: the main address first, because the server uses the first
      # one as its own, then any others that must keep working. Since the move to the new
      # domain on 28 Sep 2026:
      #   https://ozidelivery.co.uk,https://www.ozidelivery.co.uk,https://lobster-app-3ilv6.ondigitalocean.app
      - key: ALLOWED_ORIGIN
        scope: RUN_TIME
        value: ""

      # FILL IN, in the dashboard, as secrets. Each carries a marker the API recognises as
      # "not a real secret", so until they are replaced the server refuses to start in
      # production and the log names the one that is missing. That is deliberate: an
      # app that cannot take a payment is far better than one that pretends it can.
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: replace_with_the_secret_key_from_stripe

      # FILL IN, but NOT as a secret, and not by accident as the secret key.
      #
      # This is the publishable key — it begins pk_ rather than sk_. The browser needs it to
      # turn a card into a payment method, and it is public by design: it sits in the page
      # source of every site that takes a card. So it is served to the web app from /config
      # and there is nothing to protect. What must never go here is the secret key.
      #
      # Until it is filled in, the card screen says card payments are not finished being set
      # up, rather than showing a form that cannot work.
      - key: STRIPE_PUBLISHABLE_KEY
        scope: RUN_TIME
        value: replace_with_the_publishable_key_from_stripe

      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: replace_with_the_webhook_signing_secret_from_stripe

      # The Runner spending card from Stripe Issuing. A plain value, not a secret. Change it to
      # true only after Issuing is switched on for the Stripe account and the Issuing events are
      # added to the webhook (DEPLOY.md, "Switching on the Runner spending card"). While false,
      # Runners pay with their own card and are paid back straight away (ruling 55).
      - key: STRIPE_ISSUING_ENABLED
        scope: RUN_TIME
        value: "false"

      # Signs session tokens. Generate one with: openssl rand -base64 48
      - key: AUTH_TOKEN_SECRET
        scope: RUN_TIME
        type: SECRET
        value: replace_with_a_long_random_value_at_least_32_chars

      # Signing back in, by a code sent in a text. DEPLOY.md, "Signing in by text message".
      # Until all three Twilio values are real, signing in by text is switched off and the
      # sign-in screen says so. The server still starts: this is not one of the three secrets
      # it refuses to run without.
      - key: OTP_DELIVERY
        scope: RUN_TIME
        value: sms

      - key: TWILIO_ACCOUNT_SID
        scope: RUN_TIME
        type: SECRET
        value: replace_with_the_account_sid_from_twilio

      - key: TWILIO_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: replace_with_the_auth_token_from_twilio

      # A Twilio number in +44 form, a Messaging Service id beginning MG, or a sender name
      # such as OziDelivery. A sender name is at most eleven characters, so it is the product
      # name without its space. Not a secret.
      - key: TWILIO_FROM
        scope: RUN_TIME
        value: replace_with_the_number_or_name_texts_come_from

      # Codes spoken by an automatic phone call, for landlines (ruling 27). A Twilio number that
      # can make calls, in +44 form; a sender name cannot call. Until it is real, codes by call
      # are not offered. Not a secret.
      - key: TWILIO_VOICE_FROM
        scope: RUN_TIME
        value: replace_with_a_twilio_number_that_can_call

      # Notifications on a Shopper's phone when their Runner has a question. A key pair made
      # once with `node packages/api/scripts/push-keys.mjs` in the Console; DEPLOY.md,
      # "Telling a Shopper about a question", has the steps. Without both, notifications are
      # simply not offered and the question still appears on the Your order page.
      - key: VAPID_PUBLIC_KEY
        scope: RUN_TIME
        value: replace_with_the_public_key

      - key: VAPID_PRIVATE_KEY
        scope: RUN_TIME
        type: SECRET
        value: replace_with_the_private_key

      # The admin panel at /staff signs in with this. Make one with: openssl rand -base64 32
      # Until it is real, every staff page refuses everybody. LAUNCH.md, step 6.
      - key: STAFF_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: replace_with_a_long_random_staff_key

      # In-app calls (DEPLOY.md, "Switching on in-app calls"). Until all three are real, the call button is
      # simply not shown.
      - key: LIVEKIT_URL
        scope: RUN_TIME
        value: replace_with_the_livekit_project_url

      - key: LIVEKIT_API_KEY
        scope: RUN_TIME
        value: replace_with_the_livekit_api_key

      - key: LIVEKIT_API_SECRET
        scope: RUN_TIME
        type: SECRET
        value: replace_with_the_livekit_api_secret

      # Ringing a Shopper's own telephone into a call (ruling 46): LiveKit's outbound SIP trunk
      # to the Twilio number, ST_ followed by letters. docs/TWILIO_AND_LIVEKIT.md, part 4.
      # The telephone line (ruling 51): who rings when a caller asks for a person, and the owner's
      # mobile for missed calls and bank transfers. docs/TWILIO_AND_LIVEKIT.md, part 3a.
      - key: HUMAN_LINE_PHONE
        scope: RUN_TIME
        value: replace_with_the_mobile_that_takes_calls

      - key: OWNER_ALERT_PHONE
        scope: RUN_TIME
        value: replace_with_the_owners_mobile

      - key: LIVEKIT_SIP_TRUNK_ID
        scope: RUN_TIME
        value: replace_with_the_livekit_sip_trunk_id

      # Oluoma Voice (ruling 53), so Ozi speaks and hears through our own voice engine rather
      # than the phone's. DEPLOY.md, "Switching on Oluoma Voice". Until both are real, the app
      # uses the phone's own speech, as before. The key never leaves the server.
      - key: OLUOMA_VOICE_URL
        scope: RUN_TIME
        value: replace_with_the_oluoma_voice_address

      - key: OLUOMA_VOICE_KEY
        scope: RUN_TIME
        type: SECRET
        value: replace_with_the_oluoma_voice_key

# ---------------------------------------------------------------------------
# The web app
# ---------------------------------------------------------------------------
static_sites:
  - name: web
    github:
      repo: EnrichT16/aldilivery
      branch: main
      deploy_on_push: true

    source_dir: /
    environment_slug: node-js

    # This build is the accessibility gate. `pnpm --filter @aldilivery/web build` runs the
    # linter, the type check and the axe tests against every screen, and only then produces
    # a bundle. A screen with an accessibility violation does not deploy.
    build_command: |
      corepack enable || npm install --global pnpm@9.15.9
      pnpm install --frozen-lockfile --prod=false
      pnpm run build:core
      pnpm --filter @aldilivery/web build

    output_dir: packages/web/dist
    index_document: index.html
    # A single page app: every address that is not a file on disk is answered with the app
    # itself, so a refresh on /basket does not give a 404.
    catchall_document: index.html

    envs:
      # FILL IN: leave it as /api if the web app and the API share this hostname, which is
      # what the routes below arrange. Build time, because Vite bakes it into the bundle.
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: "/api"

    # Everything that is not /api. `catchall_document` above means any address that is not a
    # file on disk is answered with index.html, so a refresh on /basket works — and so an
    # address under /api would be answered here too if the API were not matching first.
    routes:
      - path: /

# ---------------------------------------------------------------------------
# The database
# ---------------------------------------------------------------------------
# Rule Eight: this database belongs to this product and to nothing else. It is a development
# database, which is the smallest managed PostgreSQL App Platform offers, and it is not
# backed up. Move it to a production cluster before there are real orders in it.
databases:
  - name: aldilivery-db
    engine: PG
    version: "16"
    production: false
